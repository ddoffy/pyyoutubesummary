[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyyoutubesummary"
version = "0.1.0"
description = "YouTube Video Summarizer API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.68.0",
    "uvicorn>=0.15.0",
    "python-dotenv>=0.19.0",
    "google-genai>=0.1.0",
    "yt-dlp>=2023.0.0",
    "pydantic>=1.8.0"
]

[tool.setuptools]
py-modules = ["main"]
